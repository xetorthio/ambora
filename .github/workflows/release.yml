name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create draft release
        run: gh release create "${{ github.ref_name }}" --draft --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: create-release
    strategy:
      matrix:
        include:
          - os: macos-latest
            script: dist:mac
          - os: windows-latest
            script: dist:win
          - os: ubuntu-latest
            script: dist:linux

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Set version from tag
        shell: bash
        # --allow-same-version so the build doesn't fail when package.json is
        # already at the tag's version (e.g. it was bumped in a merged PR before
        # tagging). Without it, `npm version` errors with "Version not changed".
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      # The App Store Connect key must exist on disk: @electron/notarize reads
      # APPLE_API_KEY as a path, not as the key material.
      - name: Write App Store Connect API key
        if: matrix.os == 'macos-latest'
        shell: bash
        env:
          APPLE_API_KEY_B64: ${{ secrets.APPLE_API_KEY_B64 }}
        run: |
          # Checked here rather than in the step's `if`: the secrets context is
          # not available in step-level conditions.
          if [ -z "$APPLE_API_KEY_B64" ]; then
            echo "No APPLE_API_KEY_B64 secret — the build will not be notarized."
            exit 0
          fi
          keydir="$RUNNER_TEMP/private_keys"
          mkdir -p "$keydir"
          printf '%s' "$APPLE_API_KEY_B64" | base64 --decode > "$keydir/AuthKey.p8"
          echo "APPLE_API_KEY=$keydir/AuthKey.p8" >> "$GITHUB_ENV"

      # Signing credentials are scoped to macOS on purpose: CSC_LINK is not
      # platform-specific, so leaking it to the Windows runner would make
      # electron-builder try to sign the installer with a Developer ID cert.
      # Missing secrets resolve to '', which electron-builder treats as absent —
      # the build then still succeeds, unsigned.
      - run: npm run ${{ matrix.script }} -- --publish never
        env:
          CSC_LINK: ${{ matrix.os == 'macos-latest' && secrets.CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.os == 'macos-latest' && secrets.CSC_KEY_PASSWORD || '' }}
          APPLE_API_KEY_ID: ${{ matrix.os == 'macos-latest' && secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ matrix.os == 'macos-latest' && secrets.APPLE_API_ISSUER || '' }}

      - name: Verify macOS signature and notarization
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          app="$(find dist -maxdepth 2 -name 'Ambora.app' -print -quit)"
          if [ -z "$app" ]; then
            echo "::warning::Ambora.app not found; skipping signature verification"
            exit 0
          fi
          echo "Inspecting $app"
          codesign --display --verbose=2 "$app" 2>&1 |
            grep -E '^(Authority|TeamIdentifier|Signature)' || true

          if codesign --verify --deep --strict "$app" 2>&1; then
            echo "codesign verification passed"
          else
            echo "::warning::codesign verification failed"
          fi

          # The real test. Gatekeeper accepts an app only once it is notarized
          # and stapled, so this distinguishes "signed" from "actually shippable".
          if spctl --assess --type execute --verbose=4 "$app" 2>&1; then
            echo "::notice::Gatekeeper accepted the app — signed and notarized"
          else
            echo "::warning::Gatekeeper rejected the app — not notarized (no Apple credentials, or notarization failed)"
          fi

      - name: Upload artifacts to release
        shell: bash
        run: |
          shopt -s nullglob
          files=(dist/*.{dmg,zip,exe,blockmap,AppImage,deb,rpm,yml,yaml})
          if [ ${#files[@]} -gt 0 ]; then
            gh release upload "${{ github.ref_name }}" "${files[@]}" \
              --repo ${{ github.repository }} --clobber
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Publish release
        run: gh release edit "${{ github.ref_name }}" --draft=false --repo ${{ github.repository }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
