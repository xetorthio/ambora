name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create draft release
        run: gh release create "${{ github.ref_name }}" --draft --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: create-release
    strategy:
      matrix:
        include:
          - os: macos-latest
            script: dist:mac
          - os: windows-latest
            script: dist:win
          - os: ubuntu-latest
            script: dist:linux

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Set version from tag
        shell: bash
        # --allow-same-version so the build doesn't fail when package.json is
        # already at the tag's version (e.g. it was bumped in a merged PR before
        # tagging). Without it, `npm version` errors with "Version not changed".
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - run: npm run ${{ matrix.script }} -- --publish never

      - name: Upload artifacts to release
        shell: bash
        run: |
          shopt -s nullglob
          files=(dist/*.{dmg,zip,exe,blockmap,AppImage,deb,rpm,yml,yaml})
          if [ ${#files[@]} -gt 0 ]; then
            gh release upload "${{ github.ref_name }}" "${files[@]}" \
              --repo ${{ github.repository }} --clobber
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Publish release
        run: gh release edit "${{ github.ref_name }}" --draft=false --repo ${{ github.repository }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
