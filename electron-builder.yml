appId: com.ambora.app
productName: Ambora
directories:
  buildResources: build
# Ensures a valid ad-hoc signature on unsigned macOS builds so Gatekeeper does
# not report the downloaded app as "damaged". No-op once Developer ID signing
# (CSC_LINK) is configured. See build/afterSign.cjs.
afterSign: build/afterSign.cjs
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
extraResources:
  - from: remote
    to: remote
asarUnpack:
  - resources/**
win:
  executableName: ambora
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  # Notarization runs only when the App Store Connect API key env vars are
  # present (APPLE_API_KEY / APPLE_API_KEY_ID / APPLE_API_ISSUER). Local builds
  # without them still produce a signed-but-unnotarized app, which is fine for
  # testing on the build machine.
  notarize: true
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
    - deb
  maintainer: Jonathan Leibiusky (@xetorthio)
  category: Audio
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
publish:
  provider: github
  owner: xetorthio
  repo: ambora
  releaseType: draft
