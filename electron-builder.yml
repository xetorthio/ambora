appId: com.ambora.app
productName: Ambora
directories:
  buildResources: build
# Ensures a valid ad-hoc signature on unsigned macOS builds so Gatekeeper does
# not report the downloaded app as "damaged". No-op once Developer ID signing
# (CSC_LINK) is configured. See build/afterSign.cjs.
afterSign: build/afterSign.cjs
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
extraResources:
  - from: remote
    to: remote
asarUnpack:
  - resources/**
win:
  executableName: ambora
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  # arm64 and x64 are built separately, so every macOS artifact carries its arch.
  # Without ${arch} the two builds would produce identically named files and the
  # second upload would silently clobber the first.
  artifactName: ${productName}-${version}-${arch}-mac.${ext}
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # NOTE: a MAP, not a list. Written as a YAML list this merges as an array and
  # lands in Info.plist as bogus "0"/"1"/"length" keys with the descriptions
  # buried inside — where macOS never reads them.
  #
  # Only what Ambora actually touches. Audio files are referenced by path, so
  # macOS gates re-reading them from these folders after a restart. Everything
  # set to null is a default Electron ships and Ambora never uses; electron-builder
  # strips null-valued keys from the final Info.plist.
  extendInfo:
    NSDocumentsFolderUsageDescription: Ambora needs access to open audio files you added to a campaign from your Documents folder.
    NSDownloadsFolderUsageDescription: Ambora needs access to open audio files you added to a campaign from your Downloads folder.
    NSCameraUsageDescription: null
    NSMicrophoneUsageDescription: null
    NSAudioCaptureUsageDescription: null
    NSBluetoothAlwaysUsageDescription: null
    NSBluetoothPeripheralUsageDescription: null
  # Notarization runs only when the App Store Connect API key env vars are
  # present (APPLE_API_KEY / APPLE_API_KEY_ID / APPLE_API_ISSUER). Local builds
  # without them still produce a signed-but-unnotarized app, which is fine for
  # testing on the build machine.
  notarize: true
dmg:
  artifactName: ${name}-${version}-${arch}.${ext}
linux:
  target:
    - AppImage
    - deb
  maintainer: Jonathan Leibiusky (@xetorthio)
  category: Audio
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
publish:
  provider: github
  owner: xetorthio
  repo: ambora
  releaseType: draft
