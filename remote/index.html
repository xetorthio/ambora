<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0C0C0E" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Ambora Remote</title>
    <link rel="icon" type="image/svg+xml" href="logomark.svg" />
    <link rel="apple-touch-icon" href="logomark.svg" />
    <link rel="stylesheet" href="remote.css" />
  </head>
  <body>
    <div id="app">
      <!-- Header -->
      <header class="header">
        <div class="header__left">
          <svg
            class="header__logo"
            viewBox="-80 -80 160 160"
            xmlns="http://www.w3.org/2000/svg"
            aria-hidden="true"
          >
            <defs>
              <linearGradient id="gA" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#7B93F5" stop-opacity="0.9" />
                <stop offset="100%" stop-color="#6659D9" stop-opacity="0.55" />
              </linearGradient>
              <linearGradient id="gB" x1="100%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#95A8F8" stop-opacity="0.9" />
                <stop offset="100%" stop-color="#7B93F5" stop-opacity="0.55" />
              </linearGradient>
            </defs>
            <path
              d="M -18,58 A 68,68 0 0,1 -18,-58"
              fill="none"
              stroke="url(#gA)"
              stroke-width="3"
              stroke-linecap="round"
              opacity="0.35"
            />
            <path
              d="M -14,44 A 52,52 0 0,1 -14,-44"
              fill="none"
              stroke="url(#gA)"
              stroke-width="3.5"
              stroke-linecap="round"
              opacity="0.6"
            />
            <path
              d="M -10,28 A 34,34 0 0,1 -10,-28"
              fill="none"
              stroke="url(#gA)"
              stroke-width="4"
              stroke-linecap="round"
              opacity="0.9"
            />
            <path
              d="M 10,28 A 34,34 0 0,0 10,-28"
              fill="none"
              stroke="url(#gB)"
              stroke-width="4"
              stroke-linecap="round"
              opacity="0.9"
            />
            <path
              d="M 14,44 A 52,52 0 0,0 14,-44"
              fill="none"
              stroke="url(#gB)"
              stroke-width="3.5"
              stroke-linecap="round"
              opacity="0.6"
            />
            <path
              d="M 18,58 A 68,68 0 0,0 18,-58"
              fill="none"
              stroke="url(#gB)"
              stroke-width="3"
              stroke-linecap="round"
              opacity="0.35"
            />
            <circle cx="0" cy="0" r="8" fill="#7B93F5" opacity="0.12" />
            <circle cx="0" cy="0" r="3.5" fill="#EAEAED" opacity="0.9" />
          </svg>
          <span id="campaign-name" class="header__title">No campaign selected</span>
        </div>
        <span id="connection-dot" class="header__status"></span>
      </header>

      <!-- Climate Grid -->
      <main id="climate-grid" class="climate-grid">
        <div class="climate-grid__empty">No campaign selected</div>
      </main>

      <!-- Ambient Drawer — hidden unless the active climate has layers -->
      <section id="ambient" class="ambient" hidden>
        <div id="ambient-panel" class="ambient__panel" hidden>
          <div id="ambient-layers" class="ambient__layers"></div>
          <div id="ambient-shots" class="ambient__shots" hidden></div>
        </div>
        <button
          id="ambient-handle"
          class="ambient__handle"
          aria-expanded="false"
          aria-controls="ambient-panel"
        >
          <span id="ambient-icon" class="ambient__handle-icon"></span>
          <span class="ambient__handle-label">Ambient</span>
          <span id="ambient-count" class="ambient__handle-count"></span>
          <span id="ambient-chevron" class="ambient__handle-chevron"></span>
        </button>
      </section>

      <!-- Now Playing -->
      <div class="now-playing">
        <span id="now-playing-dot" class="now-playing__dot"></span>
        <span id="track-title" class="now-playing__track">No track playing</span>
        <button id="btn-skip" class="now-playing__skip" disabled aria-label="Skip track"></button>
      </div>

      <!-- Controls -->
      <div class="controls">
        <button
          id="btn-play-pause"
          class="controls__play-pause"
          disabled
          aria-label="Play"
        ></button>
        <button id="btn-shuffle" class="controls__shuffle" aria-label="Shuffle"></button>
        <button id="btn-mute" class="controls__mute" aria-label="Mute"></button>
        <input
          id="volume-slider"
          class="controls__volume"
          type="range"
          min="0"
          max="100"
          value="80"
          aria-label="Volume"
        />
      </div>

      <!-- Disconnected Overlay -->
      <div id="disconnected-overlay" class="disconnected-overlay">
        <div class="disconnected-overlay__icon" id="wifi-off-icon"></div>
        <div class="disconnected-overlay__text">Disconnected</div>
        <div class="disconnected-overlay__sub">Reconnecting...</div>
      </div>
    </div>

    <script src="remote.js" defer></script>
  </body>
</html>
